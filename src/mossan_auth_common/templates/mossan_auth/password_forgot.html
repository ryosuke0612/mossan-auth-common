{% set page_title = "パスワード再設定" %}
{% include "mossan_auth/_layout_start.html" %}
<div class="auth-shell">
<section class="auth-card" aria-labelledby="auth-title">
  <h1 id="auth-title" class="auth-title">パスワード再設定</h1>
  {% include "mossan_auth/_messages.html" %}
  <form method="post" action="{{ form_action }}" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="auth-field">
      <label for="auth-email">メールアドレス</label>
      <div class="auth-input-wrap">
        <span class="auth-input-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4.2-8 4.8-8-4.8V6l8 4.8L20 6v2.2Z"/></svg>
        </span>
        <input id="auth-email" type="email" name="email" value="{{ email_value }}" autocomplete="email" placeholder="メールアドレス" required>
      </div>
    </div>
    <div class="auth-form-footer">
      <a class="auth-help-link" href="{{ auth_ui.login_url }}">ログイン画面へ戻る</a>
      <button class="auth-submit" type="submit">再設定メールを送信</button>
    </div>
  </form>
</section>
</div>
{% include "mossan_auth/_layout_end.html" %}
