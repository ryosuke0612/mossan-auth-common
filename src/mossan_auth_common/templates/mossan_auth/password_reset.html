{% set page_title = "新しいパスワード" %}
{% include "mossan_auth/_layout_start.html" %}
<section class="auth-card" aria-labelledby="auth-title">
  <h1 id="auth-title" class="auth-title">新しいパスワード</h1>
  {% include "mossan_auth/_messages.html" %}
  <form method="post" action="{{ form_action }}" class="auth-form">
    <div class="auth-field">
      <label for="auth-new-password">新しいパスワード</label>
      <div class="auth-input-wrap">
        <span class="auth-input-icon" aria-hidden="true">●</span>
        <input id="auth-new-password" type="password" name="new_password" autocomplete="new-password" placeholder="8文字以上" minlength="8" required>
      </div>
    </div>
    <div class="auth-field">
      <label for="auth-confirm-password">新しいパスワード（確認）</label>
      <div class="auth-input-wrap">
        <span class="auth-input-icon" aria-hidden="true">●</span>
        <input id="auth-confirm-password" type="password" name="confirm_password" autocomplete="new-password" placeholder="もう一度入力" minlength="8" required>
      </div>
    </div>
    <button class="auth-submit" type="submit">パスワードを更新</button>
  </form>
</section>
{% include "mossan_auth/_layout_end.html" %}
