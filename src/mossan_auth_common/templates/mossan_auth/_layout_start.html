<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} | {{ auth_ui.app_name }}</title>
  {% if auth_ui.favicon_url %}<link rel="icon" href="{{ auth_ui.favicon_url }}">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500&family=Noto+Sans+JP:wght@400;700;900&family=Yomogi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('mossan_auth.static', filename='auth.css') }}">
</head>
<body>
  <header class="auth-header">
    <div class="auth-header__inner">
      <a class="auth-logo" href="{{ auth_ui.logo_href }}" aria-label="{{ auth_ui.app_name }}">
        {% if auth_ui.logo_main_text %}<span class="auth-logo__text{% if auth_ui.logo_variant != 'handwritten' %} auth-logo__text--{{ auth_ui.logo_variant }}{% endif %}"{% if auth_ui.logo_accent_color %} style="--auth-logo-accent: {{ auth_ui.logo_accent_color }};"{% endif %}><span class="auth-logo__main">{{ auth_ui.logo_main_text }}</span>{% if auth_ui.logo_suffix_text %}<span class="auth-logo__suffix">{{ auth_ui.logo_suffix_text }}</span>{% endif %}</span>{% else %}<span class="auth-logo__text">{{ auth_ui.logo_text }}</span>{% endif %}
      </a>
      {% if not auth_login_page %}
        <nav class="auth-nav" aria-label="認証メニュー">
          <a class="auth-header__login" href="{{ auth_ui.login_url }}">管理者ログイン</a>
        </nav>
      {% endif %}
    </div>
  </header>
  <main class="auth-main">
