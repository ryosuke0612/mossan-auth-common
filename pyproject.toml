[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mossan-auth-common"
version = "0.2.2"
description = "Shared authentication UI, email templates, policy, and schema contract for Mossan Store apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mossan_auth_common = [
  "templates/mossan_auth/*.html",
  "static/*.css",
]
